<!doctype html>
<html lang="es" data-resolution="square">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <script src="assets/MotionPathPlugin.min.js"></script>
    <style>
      @font-face {
        font-family: "Sora";
        src: url("assets/sora-variable.woff2") format("woff2");
        font-weight: 100 800;
        font-display: block;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: #120a26;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Sora", system-ui, sans-serif;
        color: #f4f0fe;
      }
      #escena {
        position: absolute;
        inset: 0;
      }

      /* Fondo: el morado profundo de DOFI con sus dos resplandores */
      .fondo {
        position: absolute;
        inset: 0;
        background: radial-gradient(100% 110% at 92% 8%, #2e1b68 0%, #1a0f3d 48%, #120a26 100%);
      }
      .brillo-a {
        position: absolute;
        left: -240px;
        top: -220px;
        width: 640px;
        height: 640px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(109, 75, 201, 0.4) 0%, transparent 70%);
      }
      .brillo-b {
        position: absolute;
        right: -260px;
        bottom: -280px;
        width: 760px;
        height: 760px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(244, 123, 32, 0.3) 0%, transparent 70%);
      }
      #olas {
        position: absolute;
        left: 0;
        top: 900px;
        width: 2160px;
        height: 180px;
      }
      svg.mapa {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1080px;
      }
      .luz {
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
      }

      /* Nodos: una plataforma por circulo */
      .nodo {
        position: absolute;
        width: {{DIAMETRO}}px;
        height: {{DIAMETRO}}px;
      }
      .nodo .halo {
        position: absolute;
        inset: -70px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(244, 123, 32, 0.5) 0%, rgba(109, 75, 201, 0.3) 45%, transparent 70%);
        opacity: 0;
      }
      .nodo .onda {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 3px solid #f47b20;
        opacity: 0;
      }
      .nodo .cuerpo {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #4a2560 0%, #241553 75%);
        border: 2px solid rgba(255, 255, 255, 0.16);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 26px 60px -22px rgba(0, 0, 0, 0.65);
        opacity: 0.4;
      }
      .nodo .ico {
        width: 92px;
        height: 92px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .nodo .ico svg {
        width: 50px;
        height: 50px;
        fill: #ffffff;
      }
      .nodo .num {
        position: absolute;
        right: -6px;
        top: -6px;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: linear-gradient(180deg, #ff9440 0%, #f47b20 100%);
        color: #1a0f3d;
        font-size: 24px;
        font-weight: 800;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 18px -6px rgba(244, 123, 32, 0.7);
      }

      /* Etiquetas */
      .cw {
        position: absolute;
        width: 760px;
        display: flex;
        justify-content: center;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        height: 64px;
        padding: 0 30px 0 22px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
        border: 1.5px solid rgba(255, 255, 255, 0.22);
        font-size: 32px;
        font-weight: 700;
        letter-spacing: -0.01em;
        white-space: nowrap;
        opacity: 0;
      }
      .chip i {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        flex-shrink: 0;
      }

      /* El velero */
      #barco {
        position: absolute;
        left: 0;
        top: 0;
        width: 112px;
        height: 112px;
        opacity: 0;
      }
      #barco svg {
        width: 100%;
        height: 100%;
        fill: #ffffff;
        filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.5));
      }
      .chispa {
        position: absolute;
        left: 0;
        top: 0;
        width: 14px;
        height: 14px;
        margin: -7px 0 0 -7px;
        border-radius: 50%;
        background: #ff9440;
        opacity: 0;
      }

      /* Cierre: la frase del documento */
      .bw {
        position: absolute;
        left: 0;
        top: 972px;
        width: 1080px;
        display: flex;
        justify-content: center;
      }
      .banner {
        display: inline-flex;
        align-items: center;
        height: 76px;
        padding: 0 44px;
        border-radius: 999px;
        background: linear-gradient(180deg, #ff9440 0%, #f47b20 100%);
        color: #1a0f3d;
        font-size: 42px;
        font-weight: 800;
        letter-spacing: -0.015em;
        white-space: nowrap;
        box-shadow: 0 0 0 8px rgba(244, 123, 32, 0.18), 0 26px 50px -18px rgba(244, 123, 32, 0.8);
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1080" data-height="1080">
      <div id="escena">
        <div class="fondo"></div>
        <div class="brillo-a"></div>
        <div class="brillo-b"></div>
        <svg id="olas" viewBox="0 0 2160 180" preserveAspectRatio="none" fill="none">
          {{OLAS}}
        </svg>

        <!-- La ruta: puntos siempre visibles + el tramo que se ilumina con el velero -->
        <svg class="mapa" viewBox="0 0 1080 1080" fill="none">
          <defs>
            <linearGradient id="g-ruta" gradientUnits="userSpaceOnUse" x1="250" y1="800" x2="820" y2="290">
              <stop offset="0" stop-color="#ff9440" />
              <stop offset="0.55" stop-color="#f47b20" />
              <stop offset="1" stop-color="#8f6be8" />
            </linearGradient>
          </defs>
          <g stroke="rgba(244,240,254,0.34)" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 20">
            <path id="seg-1" d="{{SEG1}}" />
            <path id="seg-2" d="{{SEG2}}" />
            <path id="seg-3" d="{{SEG3}}" />
          </g>
          <g stroke="url(#g-ruta)" stroke-width="8" stroke-linecap="round">
            <path class="luz" id="luz-1" d="{{SEG1}}" pathLength="1" />
            <path class="luz" id="luz-2" d="{{SEG2}}" pathLength="1" />
            <path class="luz" id="luz-3" d="{{SEG3}}" pathLength="1" />
          </g>
        </svg>

        <!-- El velero va debajo de los nodos: al llegar a una plataforma entra por detras de ella (atraca) -->
        <div id="barco"><svg viewBox="0 0 256 256"><path d="{{VELERO}}" /></svg></div>

        <!-- Nodos -->
        <div class="nodo" id="nodo-1" style="left: {{N1_L}}px; top: {{N1_T}}px">
          <div class="halo" data-layout-allow-overflow></div>
          <div class="onda"></div>
          <div class="onda"></div>
          <div class="cuerpo">
            <span class="ico" style="background: linear-gradient(45deg, #feda75, #fa7e1e 30%, #d62976 60%, #962fbf 80%, #4f5bd5)"
              ><svg viewBox="0 0 24 24"><path d="{{IG}}" /></svg
            ></span>
          </div>
          <span class="num">1</span>
        </div>
        <div class="nodo" id="nodo-2" style="left: {{N2_L}}px; top: {{N2_T}}px">
          <div class="halo" data-layout-allow-overflow></div>
          <div class="onda"></div>
          <div class="onda"></div>
          <div class="cuerpo">
            <span class="ico" style="background: #4285f4"><svg viewBox="0 0 24 24"><path d="{{GOOGLE}}" /></svg></span>
          </div>
          <span class="num">2</span>
        </div>
        <div class="nodo" id="nodo-3" style="left: {{N3_L}}px; top: {{N3_T}}px">
          <div class="halo" data-layout-allow-overflow></div>
          <div class="onda"></div>
          <div class="onda"></div>
          <div class="cuerpo">
            <span class="ico" style="background: #6d4bc9"
              ><svg viewBox="0 0 24 24" style="fill: none; stroke: #ffffff; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round">
                <rect x="2.5" y="4.5" width="19" height="15" rx="2.5" />
                <path d="M2.5 9h19" />
                <circle cx="5.6" cy="6.8" r="0.5" />
                <circle cx="8.2" cy="6.8" r="0.5" />
                <path d="M7 13.5h6M7 16.2h10" /></svg
            ></span>
          </div>
          <span class="num">3</span>
        </div>
        <div class="nodo" id="nodo-4" style="left: {{N4_L}}px; top: {{N4_T}}px">
          <div class="halo" data-layout-allow-overflow></div>
          <div class="onda"></div>
          <div class="onda"></div>
          <div class="cuerpo">
            <span class="ico" style="background: #25d366"><svg viewBox="0 0 24 24"><path d="{{WHATSAPP}}" /></svg></span>
          </div>
          <span class="num">4</span>
        </div>

        <!-- Etiquetas -->
        <div class="cw" style="left: {{E1_L}}px; top: {{E1_T}}px"><div class="chip" id="chip-1"><i style="background: #d62976"></i>Descubre tu marca</div></div>
        <div class="cw" style="left: {{E2_L}}px; top: {{E2_T}}px"><div class="chip" id="chip-2"><i style="background: #4285f4"></i>Te busca en Google</div></div>
        <div class="cw" style="left: {{E3_L}}px; top: {{E3_T}}px"><div class="chip" id="chip-3"><i style="background: #8f6be8"></i>Visita tu web</div></div>
        <div class="cw" style="left: {{E4_L}}px; top: {{E4_T}}px"><div class="chip" id="chip-4"><i style="background: #25d366"></i>Te escribe por WhatsApp</div></div>

        <div id="chispas"></div>

        <div class="bw"><div class="banner" id="banner">Todo ese recorrido es tráfico.</div></div>
      </div>
    </div>

    <script>
      (function () {
        gsap.registerPlugin(MotionPathPlugin);
        const DUR = 10;
        const tl = gsap.timeline({ paused: true });
        const N = [
          { x: {{N1_X}}, y: {{N1_Y}} },
          { x: {{N2_X}}, y: {{N2_Y}} },
          { x: {{N3_X}}, y: {{N3_Y}} },
          { x: {{N4_X}}, y: {{N4_Y}} },
        ];

        // ---------- Olas: un periodo exacto en 10 s (bucle sin costura) ----------
        tl.fromTo("#olas", { x: 0 }, { x: -1080, duration: DUR, ease: "none" }, 0);

        // ---------- Guion (segundos) ----------
        const LLEGADA = [0.5, 3.1, 5.7, 8.3]; // el velero llega a cada plataforma
        const VIAJES = [
          [1.7, 3.1],
          [4.3, 5.7],
          [6.9, 8.3],
        ];
        const BANNER = 8.75;
        const SALIDA = 9.3; // desde aca todo vuelve al estado inicial
        const FADE = 0.62;

        // ---------- El velero ----------
        tl.set("#barco", { xPercent: -50, yPercent: -50, x: N[0].x, y: N[0].y }, 0);
        // vaiven continuo, finito: 11 tramos de 0,9 s = 9,9 s
        tl.fromTo("#barco svg", { rotation: -4, transformOrigin: "50% 90%" }, { rotation: 4, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 10 }, 0);
        tl.fromTo("#barco", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)" }, LLEGADA[0]);

        VIAJES.forEach(function (v, i) {
          const dur = v[1] - v[0];
          // El velero y el tramo que se ilumina comparten tiempo y curva: la
          // punta de la luz es el velero.
          tl.to("#barco", { motionPath: { path: "#seg-" + (i + 1), start: 0, end: 1 }, duration: dur, ease: "power1.inOut" }, v[0]);
          tl.fromTo("#luz-" + (i + 1), { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: dur, ease: "power1.inOut" }, v[0]);
        });

        // ---------- Plataformas y etiquetas ----------
        LLEGADA.forEach(function (t, i) {
          const nodo = "#nodo-" + (i + 1);
          tl.fromTo(nodo, { scale: 0.94 }, { scale: 1.1, duration: 0.35, ease: "back.out(2.4)" }, t);
          tl.to(nodo, { scale: 1, duration: 0.35, ease: "power2.out" }, t + 0.35);
          tl.fromTo(nodo + " .cuerpo", { opacity: 0.4 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, t);
          tl.fromTo(nodo + " .halo", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power2.out" }, t);
          tl.fromTo(nodo + " .onda", { scale: 1, opacity: 0.85 }, { scale: 1.9, opacity: 0, duration: 0.9, ease: "power2.out", stagger: 0.22, immediateRender: false }, t);
          tl.fromTo("#chip-" + (i + 1), { opacity: 0, y: 18, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.7)" }, t + 0.12);
        });

        // ---------- Llegada a WhatsApp: destello ----------
        const cont = document.getElementById("chispas");
        const CHISPAS = 14;
        for (let k = 0; k < CHISPAS; k++) {
          const ch = document.createElement("div");
          ch.className = "chispa";
          cont.appendChild(ch);
          const ang = (k / CHISPAS) * Math.PI * 2 + 0.2;
          const dist = 120 + (k % 3) * 34;
          tl.fromTo(
            ch,
            { x: N[3].x, y: N[3].y, opacity: 0, scale: 1 },
            { x: N[3].x + Math.cos(ang) * dist, y: N[3].y + Math.sin(ang) * dist, opacity: 1, scale: 0.4, duration: 0.6, ease: "power3.out" },
            LLEGADA[3] + 0.05
          );
          tl.to(ch, { opacity: 0, duration: 0.3, ease: "power1.in" }, LLEGADA[3] + 0.45);
        }

        // ---------- Todo ese recorrido es trafico ----------
        tl.fromTo(".luz", { strokeWidth: 8 }, { strokeWidth: 13, duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, BANNER - 0.3);
        tl.fromTo("#banner", { opacity: 0, y: 24, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "back.out(1.8)" }, BANNER);

        // ---------- Salida: vuelve al estado del primer cuadro (bucle exacto) ----------
        tl.to(".chip", { opacity: 0, y: 8, duration: FADE, ease: "power2.in" }, SALIDA);
        tl.to("#banner", { opacity: 0, y: 10, duration: FADE, ease: "power2.in" }, SALIDA);
        tl.to(".luz", { opacity: 0, duration: FADE, ease: "power2.in" }, SALIDA);
        tl.to("#barco", { opacity: 0, scale: 0.6, duration: FADE, ease: "power2.in" }, SALIDA);
        LLEGADA.forEach(function (_, i) {
          const nodo = "#nodo-" + (i + 1);
          tl.to(nodo, { scale: 0.94, duration: FADE, ease: "power2.in" }, SALIDA);
          tl.to(nodo + " .cuerpo", { opacity: 0.4, duration: FADE, ease: "power2.in" }, SALIDA);
          tl.to(nodo + " .halo", { opacity: 0, duration: FADE, ease: "power2.in" }, SALIDA);
        });

        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
